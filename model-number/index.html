  var UT_GH = {U:'4方向天井カセット形',L:'2方向天井カセット形',DM:'1方向天井カセット形',D:'高天井用1方向カセット形',F:'天井ビルトインカセット形',FE:'ビルトインオールダクト形',E:'天井埋込形',T:'天井吊形',V:'天吊形厨房用',K:'壁掛形',B:'床置形',BE:'床置プレナム形',BD:'床置ダクト形',P:'ペリメーター用床置形',PM:'ペリメーター用床置埋込形',WN:'壁ビルトイン形',G:'直膨コイル付外気処理ユニット',XW:'床置形ハイフレッシュ',XE:'天井埋込形ハイフレッシュ',CK:'吸込一体形クリーンエアコン',CD:'壁下吸込み形クリーンエアコン'};
  var CAP = {l:'能力表示', cap:1, note:'表示数 × 0.1kW（一部例外あり）'};
  var MINOR = {l:'マイナーチェンジ', note:'アルファベット', none:'なし'};
  var FREQ = {l:'電源周波数種別', d:{'5':'50Hz用','6':'60Hz用'}, none:'なし'};
  var SEQ = 'S→T→U→A→B→B1→BN→E→E1→EN';

  var SERIES = [
   {id:'po', name:'パナソニック オフィス・店舗用', out:{ex:'CU-P224X3E', re:/^CU-?P(\d{2,3})(X|H|C)(\d+)([EJ])?$/, map:function(m){return ['CU','P',m[1],m[2],m[3],m[4]||''];},
      f:[{l:'商品区分',d:{CU:'空冷式室外機'}},{l:'業界統一記号',d:{P:'新冷媒R410A'}},CAP,{l:'ラインナップ',d:{X:'高効率タイプ',H:'標準タイプ',C:'冷房専用'}},{l:'開発番号',note:'数順'},{l:'分類',d:OPT_P,none:'なし'}]},
    in:{ex:'CS-P112U4', re:/^CS-?P(\d{2,3})(DM|FE|BD|VK|U|L|D|F|E|T|K|B|V)(\d+)([A-Z])?$/, map:function(m){return ['CS','P',m[1],m[2],m[3],m[4]||''];},
      f:[{l:'商品区分',d:{CS:'空冷式室内機'}},{l:'業界統一記号',d:{P:'新冷媒R410A'}},{l:'能力表示',cap:1,note:'表示数 × 0.1kW（一部例外あり）'},{l:'ユニットタイプ',d:UT_PO},{l:'開発番号',note:'数順'},MINOR]}},

   {id:'pm', name:'パナソニック ビル用マルチ', out:{ex:'CU-P224UXR3E', re:/^CU-?P(\d{2,3})UX(P|R|E|K)(\d+)([A-Z]{0,2})$/, map:function(m){var t=m[4],mi='',cl='';if(t.length===1){if(t==='E'||t==='J')cl=t;else mi=t;}else if(t.length===2){mi=t[0];cl=t[1];}return ['CU','P',m[1],'UX',m[2],m[3],mi,cl];},

    in:{ex:'CS-P112U4UA6', re:/^CS-?P(\d{2,3})(DM|FE|BD|PM|WN|XW|XE|CK|CD|U|L|D|F|E|T|K|P|V|X)(\d+)U([A-Z]?)([56]?)$/, map:function(m){return ['CS','P',m[1],m[2],m[3],'U',m[4],m[5]];},
      f:[{l:'商品区分',d:{CS:'空冷式室内機'}},{l:'業界統一記号',d:{P:'新冷媒R410A'}},CAP,{l:'ユニットタイプ',d:UT_PM},{l:'開発番号',note:'数順'},{l:'接続室外機タイプ',d:{U:'ビル用マルチ'}},MINOR,FREQ]}},

   {id:'so', name:'三洋電機 オフィス・店舗用', out:{ex:'SPW-CHVP50BN2', re:/^SPW-?C(H)(E|V)P(\d{2,3})(BN|B1|EN|E1|S|T|U|A|B|E)([EJ2])?$/, map:function(m){return ['SPW','C',m[1],m[2],'P',m[3],m[4],m[5]||''];},
      f:[{l:'商品区分',d:{SPW:'空冷式室外機'}},{l:'室外機ユニットの意味',d:{C:'コンデンショニングユニット'}},{l:'能力種別',d:{H:'ヒートポンプ'}},{l:'ラインナップ',d:{E:'エスパシオ（インバータ機種）',V:'スーパーエスパシオⅡ（インバータ機種）'}},{l:'業界統一記号',d:{P:'新冷媒R410A'}},CAP,{l:'開発番号',note:'例：BN、Eなど'},{l:'分類',d:{E:'耐塩害仕様',J:'耐重塩害仕様','2':'単相機種'},none:'なし'}]},
    in:{ex:'SPW-SP56BN', re:/^SPW-?(SS|SA|SL|BD|BU|TK|S|T|K|E)P(\d{2,3})(BN|B1|EN|E1|B|E)$/, map:function(m){return ['SPW',m[1],'P',m[2],m[3]];},
      f:[{l:'商品区分',d:{SPW:'空冷式室内機'}},{l:'ユニットタイプ',d:UT_SO},{l:'業界統一記号',d:{P:'新冷媒対応品'}},{l:'能力表示',cap:1,note:'表示数 × 0.1kW'},{l:'開発番号表示',note:'B形（B、BN、E）'}]}},

   {id:'sm', name:'三洋電機 ビル用マルチ', out:{ex:'SPW-CH280B-E', re:/^SPW-?CH(WDZ|DX|DZ)?(\d{2,3})(BN|B1|EN|E1|S|T|U|A|B|E)-?([EJ])?$/, map:function(m){return ['SPW','C','H',m[1]||'',m[2],m[3],m[4]||''];},
      f:[{l:'商品区分',d:{SPW:'空冷式室外機'}},{l:'室外機ユニットの意味',d:{C:'コンデンショニングユニット'}},{l:'能力種別',d:{H:'ヒートポンプ'}},{l:'ラインナップ',d:{DX:'スーパーWマルチ',DZ:'スーパーW-3WAYマルチ',WDZ:'水熱源W-3WAYマルチ'},none:'なし（記載のない機種あり）'},CAP,{l:'開発番号',note:'開発番号の推移：'+SEQ},{l:'分類',d:OPT_P,none:'なし'}]},
    in:{ex:'SPW-SXRP56BH', re:/^SPW-?(GUF|GU|UF|MD|MK|DE|FM|BM|DM|SS|SA|SL|BD|BU|TK|S|U|T|K|E|F|Y)X(RP|R|P)(\d{2,3})(BH|B)$/, map:function(m){return ['SPW',m[1],'X',m[2],m[3],m[4]];},
      f:[{l:'商品区分',d:{SPW:'空冷式室内機'}},{l:'ユニットタイプ',d:UT_SM},{l:'ラインナップ',d:{X:'マルチ機種'}},{l:'業界統一記号',d:{R:'新冷媒R410A対応品',P:'新冷媒対応品'},multi:1},{l:'能力表示',cap:1,note:'表示数 × 0.1kW（※印の機種は処理風量）'},{l:'開発番号表示',d:{B:'ヒーターレス標準品',BH:'補助ヒーター内蔵三相電源機種'}}]}},

   {id:'gh', name:'パナソニック ガスヒートポンプ（GHP）', out:{ex:'U-GH224S1DRE', re:/^U-?G(W|F|C)?(H|X|P|Z|B)(\d{2,3})([A-Z]\d*)(S)?(D)?(R)?([EJWXY])?$/, map:function(m){return ['U','G',m[1]||'',m[2],m[3],m[4],m[5]||'',m[6]||'',m[7]||'',m[8]||''];},
      f:[{l:'商品区分',d:{U:'ガスヒートポンプ室外機'}},{l:'業界統一記号',d:{G:'ガスヒートポンプ'}},{l:'接続仕様',d:{W:'Wマルチ',F:'3WAYマルチ',C:'チラー接続専用機'},none:'無＝ビル用マルチ'},{l:'ラインナップ',d:{H:'標準室外機',X:'ハイパワーエクセル',P:'ソーラーリンクエクセル',Z:'ハイパワーマルチ',B:'エクセルプラス'}},CAP,{l:'開発番号',note:'M1・M2・M3、S1・S2・S3…（アルファベット順送り。I・O・Q・Zは除く）'},{l:'電源仕様',d:{S:'単相200V'},none:'無＝三相200V'},{l:'臭気触媒',d:{D:'臭気触媒付き（現行機は全機付き）'},none:'なし'},{l:'使用条件',d:{R:'リニューアル用'},none:'無＝新設用'},{l:'分類',d:{E:'耐塩害仕様',J:'耐重塩害仕様',W:'温水取出仕様',X:'温水取出＋耐塩害',Y:'温水取出＋耐重塩害'},none:'なし'}]},
    in:{ex:'S-G112US1', re:/^S-?G(\d{2,3})(DM|FE|BE|BD|PM|WN|XW|XE|CK|CD|U|L|D|F|E|T|V|K|B|P|G)([A-Z]\d*)([A-Z]?)([56]?)$/, map:function(m){return ['S','G',m[1],m[2],m[3],m[4],m[5]];},
      f:[{l:'商品区分',d:{S:'ガスヒートポンプ室内機'}},{l:'業界統一記号',d:{G:'ガスヒートポンプ'}},CAP,{l:'ユニットタイプ',d:UT_GH},{l:'開発番号',note:'アルファベット順送り（I・O・Q・Zは除く）'},MINOR,FREQ]}}
  ];
  var CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function meaning(f, v, vals){
    if (v === '') return f.none || '（なし）';
    if (f.cap){
      var n = parseInt(v,10); if (isNaN(n)) return v;
      var kw = (n/10).toFixed(1)+' kW';
      if (vals && /^(GU|GUF|UF)$/.test(vals[1]||'') ) return '処理風量（表示数×0.1）※外気処理系の機種';
      return kw+'（'+v+' × 0.1kW）';
    }
    if (f.multi){ return v.split('').map(function(c){return c+'：'+(f.d[c]||'?');}).join(' ／ '); }
    if (f.d) return f.d[v] || '（早見表にない記号です）';
    return f.note || '';
  }
  function seg(f, vals){
    return '<div class="seg">'+f.map(function(fl,i){
      var v = vals[i];
      return '<div class="sg c'+(i%10)+(v===''?' empty':'')+'"><div class="no">'+CIRC[i]+'</div><div class="cd">'+(v===''?'□':esc(v))+'</div></div>';
    }).join('')+'</div>';
  }
  function decodeTable(f, vals){
    return '<table class="t"><tr><th>No.</th><th>項目</th><th>記号</th><th>意味</th></tr>'+f.map(function(fl,i){
      return '<tr><td>'+CIRC[i]+'</td><td>'+esc(fl.l)+'</td><td class="k">'+(vals[i]===''?'—':esc(vals[i]))+'</td><td>'+esc(meaning(fl,vals[i],vals))+'</td></tr>';
    }).join('')+'</table>';
  }
  function norm(s){return s.normalize('NFKC').toUpperCase().replace(/[\s　・･()（）]/g,'').replace(/[ー－−‐]/g,'-');}

  function decode(raw){
    var s = norm(raw); if (!s) return null;
    for (var i=0;i<SERIES.length;i++){
      var kinds=[['out','室外機'],['in','室内機']];
      for (var k=0;k<2;k++){
        var u = SERIES[i][kinds[k][0]], m = s.match(u.re);
        if (m) return {series:SERIES[i], unit:u, kind:kinds[k][1], vals:u.map(m)};
      }
    }
    return null;
  }
  function showResult(){
    var v = document.getElementById('q').value, box = document.getElementById('res');
    if (!v.trim()){ box.innerHTML = '<div class="body">型番を入力するか、上の例をタップしてください。</div>'; return; }
    var r = decode(v);
    if (!r){ box.innerHTML = '<div class="miss">この型番は読み取れませんでした。ハイフンや記号の入力、対象機種（パナソニック・三洋電機の業務用PAC、GHP）を確認してください。</div>'; return; }
    box.innerHTML = '<div class="res-h"><span class="tag">'+r.kind+'</span>'+esc(r.series.name)+'</div>'+seg(r.unit.f, r.vals)+decodeTable(r.unit.f, r.vals);
  }

  // 例
  var exs = document.getElementById('exs');
  SERIES.forEach(function(s){ ['out','in'].forEach(function(k){
    var b = document.createElement('button'); b.type='button'; b.className='ex'; b.textContent = s[k].ex;
    b.onclick = function(){ document.getElementById('q').value = s[k].ex; showResult(); };
    exs.appendChild(b);
  });});
  document.getElementById('q').addEventListener('input', showResult);

  // 早見表
  var curS = 0, curU = 'out';
  function renderRef(){
    var st = document.getElementById('stabs'), ut = document.getElementById('utabs');
    st.innerHTML = SERIES.map(function(s,i){return '<button type="button" class="tab'+(i===curS?' on':'')+'" data-s="'+i+'">'+esc(s.name)+'</button>';}).join('');
    ut.innerHTML = [['out','室外機の型番'],['in','室内機の型番']].map(function(x){return '<button type="button" class="tab'+(x[0]===curU?' on':'')+'" data-u="'+x[0]+'">'+x[1]+'</button>';}).join('');
    var s = SERIES[curS], u = s[curU], vals = u.map(u.ex.toUpperCase().replace(/[\s　]/g,'').match(u.re));
    var h = '<div class="res-h">'+esc(s.name)+'（'+(curU==='out'?'室外機':'室内機')+'）</div>'
          + '<div class="body" style="margin-bottom:6px;">例：<b style="font-family:var(--font-mono); color:var(--text-1);">'+esc(u.ex)+'</b></div>'
          + seg(u.f, vals);
    h += u.f.map(function(fl,i){
      var body = '';
      if (fl.d){ body = Object.keys(fl.d).map(function(c){return '<div class="opt"><b>'+esc(c)+'</b>'+esc(fl.d[c])+'</div>';}).join(''); if (fl.none) body += '<div class="opt"><b>□</b>'+esc(fl.none)+'</div>'; }
      else body = '<div class="opt">'+esc(fl.note||'')+'</div>';
      return '<div class="fcard c'+(i%10)+'"><h4><i>'+CIRC[i]+'</i>'+esc(fl.l)+'</h4>'+body+'</div>';
    }).join('');
    document.getElementById('ref').innerHTML = h;
    Array.prototype.forEach.call(st.querySelectorAll('.tab'), function(b){ b.onclick=function(){curS=+b.getAttribute('data-s'); renderRef();}; });
    Array.prototype.forEach.call(ut.querySelectorAll('.tab'), function(b){ b.onclick=function(){curU=b.getAttribute('data-u'); renderRef();}; });
  }
  renderRef(); showResult();
})();
</script>
<script src="../shared/back-button.js" defer></script>
<script src="../shared/glossary-link.js" defer></script>
</body>
